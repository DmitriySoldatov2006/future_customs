{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'main/css/register.css' %}">
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-wrapper">
        <h1>Регистрация аккаунта</h1>
        <input class='login-input' type="email" name="email" placeholder='Электронная почта'/>
        <input class='login-input' type="text" name="username" placeholder='Имя'/>
        <input class='login-input' type="password" name="password" placeholder='Пороль'/>
        <button>Зарегестрироваться</button>
        <h2>Уже есть аккаунт? <a class='go-reg' href="{% url 'login' %}">Войти</a></h2>
    </div>
</div>
{% endblock %}
